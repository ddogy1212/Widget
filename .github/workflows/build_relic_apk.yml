name: Build RE-LIC APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RELIC_Android_Project.zip'
      - '.github/workflows/build_relic_apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Unpack RE-LIC project
        run: |
          rm -rf project
          mkdir -p project   
          unzip -q RELIC_Android_Project.zip -d project
          test -f project/RELIC_Android/settings.gradle.kts

      - name: Build debug APK
        working-directory: project/RELIC_Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RELIC-debug-apk
          path: project/RELIC_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
